<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeScript Snake Live-coding</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121214;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      gap: 1rem;
    }
    canvas {
      border: 2px solid #50fa7b;
      box-shadow: 0 0 20px rgba(80, 250, 123, 0.2);
      max-width: calc(100vw - 2rem);
      height: auto;
    }
    .direction-controls {
      display: grid;
      grid-template-columns: repeat(3, 3.5rem);
      grid-template-rows: repeat(3, 3.5rem);
      gap: 0.5rem;
    }
    .direction-controls [data-direction="UP"] {
      grid-column: 2;
      grid-row: 1;
    }
    .direction-controls [data-direction="LEFT"] {
      grid-column: 1;
      grid-row: 2;
    }
    .direction-controls [data-direction="DOWN"] {
      grid-column: 2;
      grid-row: 3;
    }
    .direction-controls [data-direction="RIGHT"] {
      grid-column: 3;
      grid-row: 2;
    }
  </style>
</head>
<body>

  <button class="btn btn-outline-light" id="reloadButton" type="button">
    <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
    Restart game
  </button>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="direction-controls" aria-label="Snake direction controls">
    <button class="btn btn-success" type="button" data-direction="UP" aria-label="Move up">
      <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </button>
    <button class="btn btn-success" type="button" data-direction="LEFT" aria-label="Move left">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
    </button>
    <button class="btn btn-success" type="button" data-direction="DOWN" aria-label="Move down">
      <i class="bi bi-arrow-down" aria-hidden="true"></i>
    </button>
    <button class="btn btn-success" type="button" data-direction="RIGHT" aria-label="Move right">
      <i class="bi bi-arrow-right" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Подключаем TypeScript как модуль через Vite -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
